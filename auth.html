<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Express Trade • Sign in</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{height:100vh;overflow:hidden;}
  .split{display:grid;grid-template-columns:1.1fr 1fr;height:100vh;width:100%;}
  .brand{
    background:radial-gradient(circle at 20% 20%, #1c1610, var(--ink) 60%);
    border-right:1px solid var(--line);
    padding:60px;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .brand-mark{display:flex;align-items:center;gap:12px;}
  .brand-mark .sq{width:40px;height:40px;border-radius:10px;background:linear-gradient(160deg,var(--copper),var(--copper-dim));display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;color:#0a0d12;}
  .brand-mark span{font-family:'Fraunces',serif;font-size:1.2rem;}
  .brand-quote{max-width:440px;}
  .brand-quote h1{font-size:2.3rem;line-height:1.25;font-weight:500;margin-bottom:14px;}
  .brand-quote p{color:var(--text-faint);font-size:.9rem;line-height:1.6;}
  .brand-foot{color:var(--text-faint);font-size:.75rem;}

  .form-side{display:flex;align-items:center;justify-content:center;padding:30px;overflow-y:auto;}
  .auth-card{width:100%;max-width:380px;}
  .auth-card h2{font-size:1.6rem;margin-bottom:6px;}
  .auth-card .sub{color:var(--text-faint);font-size:.85rem;margin-bottom:26px;}

  .tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:5px;margin-bottom:24px;}
  .tabs button{flex:1;padding:9px;border:none;border-radius:8px;background:transparent;color:var(--text-faint);font-weight:600;font-size:.85rem;cursor:pointer;transition:.15s;}
  .tabs button.active{background:var(--copper);color:#0a0d12;}

  .hidden{display:none !important;}
  .msg{margin-top:14px;padding:11px 14px;border-radius:9px;font-size:.83rem;font-weight:500;display:none;}
  .msg.success{display:block;background:#0f2420;color:var(--teal);border:1px solid #1e4a3f;}
  .msg.error{display:block;background:#251616;color:var(--rose);border:1px solid #4a2a28;}
  .msg.info{display:block;background:#151d2b;color:#7ea8d8;border:1px solid #263a56;}

  @media (max-width:820px){ .split{grid-template-columns:1fr;} .brand{display:none;} }
</style>
</head>
<body>

<div class="split">
  <div class="brand">
    <div class="brand-mark"><div class="sq">E</div><span>Express Trade</span></div>
    <div class="brand-quote">
      <h1>Express Trade</h1>
      <p>Fast, simple access to global crypto and currency markets.</p>
    </div>
    <div class="brand-foot">© Express Trade</div>
  </div>

  <div class="form-side">
    <div class="auth-card">
      <h2 id="cardTitle">Express trade </h2>
      <p class="sub" id="cardSub">Access your trading account.</p>

      <div class="tabs">
        <button class="active" id="loginTab">sign up</button>
        <button id="signupTab">Create account</button>
      </div>

      <form id="loginForm">
        <div class="field"><label>Email</label><input type="email" id="loginEmail" placeholder="you@example.com" required /></div>
        <div class="field"><label>Password</label><input type="password" id="loginPassword" placeholder="••••••••" required /></div>
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      </form>

      <form id="signupForm" class="hidden">
        <div class="field"><label>Full name</label><input type="text" id="signupName" placeholder="Jordan Lee" required /></div>
        <div class="field"><label>Email</label><input type="email" id="signupEmail" placeholder="you@example.com" required /></div>
        <div class="field"><label>Password</label><input type="password" id="signupPassword" placeholder="At least 6 characters" required /></div>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>

      <div class="msg" id="msgBox"></div>
      <p style="font-size:.72rem;color:var(--text-faint);text-align:center;margin-top:18px;">
        <i class="fas fa-circle-info"></i> New accounts require company's approval.
      </p>
    </div>
  </div>
</div>

<script>
(function(){
  const USERS_KEY = 'ledgerlineUsers';
  const SESSION_KEY = 'ledgerlineSession';

  const loginTab = document.getElementById('loginTab');
  const signupTab = document.getElementById('signupTab');
  const loginForm = document.getElementById('loginForm');
  const signupForm = document.getElementById('signupForm');
  const msgBox = document.getElementById('msgBox');
  const cardTitle = document.getElementById('cardTitle');
  const cardSub = document.getElementById('cardSub');

  function clearMsg(){ msgBox.className='msg'; msgBox.style.display='none'; }
  function showMsg(text, type){ msgBox.className = 'msg ' + type; msgBox.textContent = text; msgBox.style.display='block'; }

  loginTab.addEventListener('click', ()=>{
    loginTab.classList.add('active'); signupTab.classList.remove('active');
    loginForm.classList.remove('hidden'); signupForm.classList.add('hidden');
    cardTitle.textContent = 'Sign in'; cardSub.textContent = 'Access your trading account.';
    clearMsg();
  });
  signupTab.addEventListener('click', ()=>{
    signupTab.classList.add('active'); loginTab.classList.remove('active');
    signupForm.classList.remove('hidden'); loginForm.classList.add('hidden');
    cardTitle.textContent = 'Create account'; cardSub.textContent = 'Set up a new trading account.';
    clearMsg();
  });

  function getUsers(){ return JSON.parse(localStorage.getItem(USERS_KEY)) || []; }
  function saveUsers(u){ localStorage.setItem(USERS_KEY, JSON.stringify(u)); }

  signupForm.addEventListener('submit', function(e){
    e.preventDefault();
    const name = document.getElementById('signupName').value.trim();
    const email = document.getElementById('signupEmail').value.trim().toLowerCase();
    const password = document.getElementById('signupPassword').value;

    if(!name || !email || !password){ showMsg('Please fill in all fields.', 'error'); return; }
    if(password.length < 6){ showMsg('Password must be at least 6 characters.', 'error'); return; }

    const users = getUsers();
    if(users.find(u => u.email === email)){ showMsg('That email is already registered.', 'error'); return; }

    users.push({
      id: Date.now(),
      name, email, password,
      balance: 0,
      btc: 0,
      status: 'pending',
      createdAt: new Date().toISOString()
    });
    saveUsers(users);

    showMsg('Account created — waiting on admin approval.', 'success');
    signupForm.reset();
    setTimeout(()=>{ loginTab.click(); showMsg('Log in once your account has been approved.', 'info'); }, 1800);
  });

  loginForm.addEventListener('submit', function(e){
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim().toLowerCase();
    const password = document.getElementById('loginPassword').value;

    const users = getUsers();
    const user = users.find(u => u.email === email && u.password === password);
    if(!user){ showMsg('Invalid email or password.', 'error'); return; }
    if(user.status === 'blocked'){ showMsg('This account has been blocked.', 'error'); return; }
    if(user.status === 'pending'){ showMsg('This account is waiting on admin approval.', 'info'); return; }

    localStorage.setItem(SESSION_KEY, JSON.stringify(user));
    showMsg('Signed in — redirecting…', 'success');
    setTimeout(()=>{ window.location.href = 'dashboard.html'; }, 900);
  });

  const session = JSON.parse(localStorage.getItem(SESSION_KEY));
  if(session && session.status === 'approved'){
    window.location.href = 'dashboard.html';
  }
})();
</script>

</html>
