<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Withdraw • Express Trade</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .shell{max-width:520px;margin:0 auto;}
  .icon-big{font-size:5rem;color:var(--rose);margin:15px 0 20px;text-align:center;}
  .message-box{background:#2f1f22;border:2px solid #5a3133;border-radius:20px;padding:30px 20px;margin:20px 0 25px;text-align:center;}
  .message-box i{font-size:3rem;color:var(--rose);margin-bottom:15px;display:block;}
  .message-box .big-text{font-size:1.3rem;font-weight:700;color:var(--rose);}
  .message-box .detail{font-size:.95rem;color:#bcc6e8;margin-top:10px;line-height:1.6;}
  .message-box .detail i{font-size:1rem;display:inline;color:var(--copper);}
</style>
</head>
<body>
<div class="shell">
  <div style="width:100%;">
    <a href="dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to dashboard</a>
    <div class="card">
      <div class="icon-big"><i class="fas fa-ban"></i></div>
      <h2 style="text-align:center;color:var(--rose);">Withdrawal Unavailable</h2>
      <p style="color:var(--text-faint);font-size:.95rem;text-align:center;">We're sorry, but withdrawals are currently restricted</p>

      <div class="message-box">
        <i class="fas fa-hourglass-half"></i>
        <div class="big-text">⛔ Trading Not Complete</div>
        <div class="detail">
          <i class="fas fa-exclamation-triangle"></i> You must complete your current trade cycle before you can withdraw funds.<br><br>
          <i class="fas fa-clock"></i> Estimated completion time: 24-48 hours
        </div>
      </div>

      <div style="font-size:.8rem;color:#5b6a8f;margin-top:10px;text-align:center;">
        <i class="fas fa-info-circle"></i> Contact support if you need immediate assistance
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAueqbCcGN_LKDTd6YnPkPcWSIufFqsqwM",
  authDomain: "fedex-4bdba.firebaseapp.com",
  projectId: "fedex-4bdba",
  storageBucket: "fedex-4bdba.firebasestorage.app",
  messagingSenderId: "770647474446",
  appId: "1:770647474446:web:8a3a4c595b2286e7ab575f"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const ADMIN_EMAIL = 'avaboremiracle@gmail.com';

auth.onAuthStateChanged(async (user)=>{
  if(!user){ window.location.href='index.html'; return; }
  // Admin allowed — don't kick them out
  if(user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) return;
  // Regular user — must be approved
  const doc = await db.collection('users').doc(user.uid).get();
  if(!doc.exists || doc.data().status !== 'approved'){
    await auth.signOut(); window.location.href='index.html'; return;
  }
});
</script>
